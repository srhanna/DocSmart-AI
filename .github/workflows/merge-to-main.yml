name: Merge fixes to main

on:
  push:
    branches:
      - copilot/remove-json-file

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge copilot/remove-json-file into main
        run: |
          git fetch origin main
          git checkout main
          git merge origin/copilot/remove-json-file \
            --no-ff \
            -m "Deploy: apply all site fixes from copilot/remove-json-file"
          git push origin main
