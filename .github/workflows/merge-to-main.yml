name: Merge fixes to main

# INSTRUCTIONS FOR REPO OWNER:
# This workflow copies all site fixes onto the main branch so Vercel deploys them.
# To run it:
#   1. Go to: https://github.com/srhanna/DocSmart-AI/actions/workflows/merge-to-main.yml
#   2. Click the "Run workflow" button (green button, top-right of the table)
#   3. Click "Run workflow" again to confirm
#
# Alternatively, just merge PR #3 at: https://github.com/srhanna/DocSmart-AI/pull/3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge copilot/remove-json-file into main
        run: |
          git fetch origin main
          git checkout main
          git merge origin/copilot/remove-json-file \
            --no-ff \
            -m "Deploy: apply all site fixes (vercel.json, file structure, deps)"
          git push origin main
